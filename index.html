
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code</title>
<style>

*{
    box-sizing:border-box;
}

body { 
    font-family: Arial, sans-serif; 
    text-align: center; 
    margin: 0;
    padding: 20px;
    background-color: #f5f5f5; 
    overflow-x:hidden;
}

.container{
    max-width:500px;
    margin:auto;
}

h1{
    font-size:2rem;
    margin-bottom:20px;
}

#qrcode { 
    margin: 20px auto; 
    display: inline-block; 
    background: white; 
    padding: 15px; 
    border-radius: 10px; 
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    width:100%;
    max-width:420px;
}

#qrcode canvas{
    width:100% !important;
    height:auto !important;
}

#nome { 
    margin-top: 10px; 
    font-weight: bold; 
    font-size: 22px;
    word-break:break-word;
}

input[type="text"], input[type="file"] {
    padding: 12px;
    margin: 8px 0;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

button {
    flex:1 1 140px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #fff;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

@media(max-width:600px){

    h1{
        font-size:1.5rem;
    }

    button{
        width:100%;
    }

    #qrcode{
        padding:10px;
    }
}

</style>
</head>
<body>

<body>

<div class="container">

<h1>Gerador de QR Code</h1>

<input type="text" id="link" placeholder="Digite o link"><br>
<input type="text" id="nomeInput" placeholder="Digite o nome (opcional)"><br>
<input type="file" id="logoInput" accept="image/*"><br>

<div class="buttons">
    <button onclick="gerarQRCode()">Gerar QR Code</button>
    <button onclick="baixarQRCode()">Baixar JPG</button>
    <button onclick="compartilharQRCode()">Compartilhar</button>
</div>

<div id="qrcode"></div>
<div id="nome"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script>
let canvasQR;

function gerarQRCode() {
    const link = document.getElementById('link').value;
    const nome = document.getElementById('nomeInput').value;
    const logoInput = document.getElementById('logoInput').files[0];

    if (!link) { alert("Por favor, insira um link!"); return; }

    document.getElementById('qrcode').innerHTML = "";
    document.getElementById('nome').innerText = nome;

    const qr = new QRCode(document.getElementById('qrcode'), {
        text: link,
        width: window.innerWidth < 600 ? 250 : 400,
height: window.innerWidth < 600 ? 250 : 400,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
        canvasQR = document.querySelector("#qrcode canvas");

        if (logoInput) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function() {
                    const ctx = canvasQR.getContext("2d");
                    const logoSize = canvasQR.width / 4;
                    ctx.drawImage(img, (canvasQR.width - logoSize)/2, (canvasQR.height - logoSize)/2, logoSize, logoSize);
                }
            }
            reader.readAsDataURL(logoInput);
        }
    }, 200);
}

function baixarQRCode() {
    if (!canvasQR) { alert("Gere o QR Code primeiro!"); return; }
    const link = document.createElement('a');
    link.href = canvasQR.toDataURL("image/jpeg");
    link.download = "qr_code.jpg";
    link.click();
}

function compartilharQRCode() {
    if (!canvasQR) { alert("Gere o QR Code primeiro!"); return; }
    if (navigator.canShare && navigator.canShare({ files: [] })) {
        canvasQR.toBlob(blob => {
            const file = new File([blob], "qr_code.jpg", { type: "image/jpeg" });
            navigator.share({
                files: [file],
                title: 'QR Code',
                text: 'Confira este QR Code'
            }).catch(err => alert("Erro ao compartilhar: " + err));
        }, 'image/jpeg');
    } else {
        alert("Compartilhamento não suportado neste navegador. Use o botão de download.");
    }
}
</script>
<button id="btnInstall" style="display:none;">📲 Instalar App</button>
<script>
let deferredPrompt;
const btnInstall = document.getElementById("btnInstall");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = "block"; // mostra o botão
});

btnInstall.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log("Resultado da instalação:", outcome);
    deferredPrompt = null;
    btnInstall.style.display = "none";
  }
});

// Registrar o Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
